# Link-check settings for .github/workflows/links.yml.
max_retries = 3
retry_wait_time = 5
timeout = 30

# Some vendor sites (for example OpenAI and Microsoft) return 403 or 429 to
# automated clients even though the page loads in a browser.
accept = ["200..=299", "403", "429"]

exclude = [
  # Pages behind a login or that need JavaScript to render.
  '^https://github\.com/settings/',
  '^https://github\.com/Trian27/RutgersAIResources/issues/new',
  # Fails over HTTP/2 in lychee but loads in browsers and curl.
  '^https://gemini\.google\.com/$',
  # Example local preview URL in the contributing guide.
  '^http://localhost',
]
