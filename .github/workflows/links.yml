name: Check links

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "lychee.toml", ".github/workflows/links.yml"]
  pull_request:
    paths: ["docs/**", "README.md", "lychee.toml", ".github/workflows/links.yml"]
  schedule:
    # Monthly, so expired offers and moved pages get noticed.
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check links in Markdown
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config lychee.toml --no-progress 'docs/**/*.md' README.md
