name: Suggest or correct a resource
description: Add a resource, report an expired offer or broken link, or fix outdated instructions.
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change?
      options:
        - Add a new resource
        - An offer has ended or changed
        - Broken link
        - Outdated tutorial or instructions
        - Something else
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page on this site
      description: Link to the page that needs the change, if there is one.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What the resource is, who qualifies, and what should change.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source
      description: A link to the vendor's or Rutgers' own page that supports the change.
    validations:
      required: true
